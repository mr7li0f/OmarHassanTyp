<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omar Hassan Type — Admin</title>
  <link rel="icon" href="../logo.jpeg">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    div[class*="IconWrapper"], div[class*="Logo"], .nc-github-authentication-page-logo { font-size: 0 !important; color: transparent !important; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/public/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
