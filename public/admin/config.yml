backend:
  name: git-gateway
  repo: mr7li0f/OmarHassanTyp
  branch: main

local_backend: true

publish_mode: simple

collections:
  - name: content
    label: إدارة المحتوى
    files:
      - file: public/content.json
        label: الخطوط
        name: fonts
        fields:
          - widget: list
            name: fonts
            label: الخطوط
            label_singular: خط
            summary: "{{fields.title}} ({{fields.title_en}})"
            fields:
              - { label: "المعرف", name: "id", widget: number, value_type: int, required: false }
              - { label: "الاسم (عربي)", name: title, widget: string }
              - { label: "الاسم (إنجليزي)", name: title_en, widget: string }
              - { label: "الوصف (عربي)", name: description_ar, widget: text }
              - { label: "الوصف (إنجليزي)", name: description_en, widget: text }
              - { label: "الوصف (كردي)", name: description_ku, widget: text, required: false }
              - { label: "رابط ملف الخط", name: downloadUrl, widget: string }
              - { label: "رابط ZIP", name: zipUrl, widget: string, required: false }
              - label: صور البوسترات
                name: images
                widget: list
                summary: "{{fields.path}}"
                field: { label: "رابط الصورة", name: path, widget: string }
              - label: الأوزان
                name: weights
                widget: list
                summary: "{{fields.weight}}"
                field: { label: "الوزن", name: weight, widget: string }
              - { label: "جديد؟", name: isNew, widget: boolean, required: false }

      - file: public/content.json
        label: روابط التواصل
        name: social
        fields:
          - widget: list
            name: socialLinks
            label: روابط التواصل
            label_singular: رابط
            summary: "{{fields.platform}}"
            fields:
              - { label: "المنصة", name: platform, widget: string }
              - { label: "الرابط", name: url, widget: string }
              - { label: "الأيقونة (default)", name: icon, widget: string, required: false }
              - { label: "كود SVG", name: icon_svg, widget: text, required: false }
              - { label: "الترتيب", name: sort_order, widget: number, value_type: int, required: false }
