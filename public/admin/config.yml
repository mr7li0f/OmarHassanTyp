backend:
  name: git-gateway
  repo: mr7li0f/OmarHassanTyp
  branch: main

media_folder: "public/assets"
public_folder: "/public/assets"

collections:
  - name: "fonts"
    label: "الخطوط"
    delete: false
    editor:
      preview: false
    files:
      - name: "font_list"
        label: "قائمة الخطوط"
        file: "public/content.json"
        fields:
          - name: "fonts"
            label: "الخطوط المتاحة"
            widget: "list"
            fields:
              - { label: "اسم الخط", name: "name", widget: "string" }
              - { label: "الوصف", name: "description", widget: "text" }
              - { label: "صورة الخط", name: "image", widget: "image" }
              - { label: "ملف الخط ZIP", name: "file", widget: "file" }
