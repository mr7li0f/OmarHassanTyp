backend:
  name: github
  repo: mr7li0f/OmarHassanTyp
  branch: main
  base_url: https://decap-cms-oauth-gate.vercel.app

media_folder: "public/assets"
public_folder: "/public/assets"

collections:
  - name: "site_settings"
    label: "⚙️ إعدادات الموقع العامة"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "البيانات الأساسية والتواصل"
        file: "public/settings.json"
        fields:
          - { label: "عنوان الموقع الرئيسي", name: "site_title", widget: "string", required: true }
          - { label: "الاسم التجاري / التوقيع", name: "brand_name", widget: "string", required: true }
          - { label: "وصف الموقع (SEO)", name: "site_description", widget: "text", required: false }
          - { label: "نص الترحيب بالهيدر", name: "hero_text", widget: "string", required: false }
          - { label: "رابط تليجرام", name: "telegram_url", widget: "string", required: false }
          - { label: "رابط واتساب", name: "whatsapp_url", widget: "string", required: false }
          - { label: "رابط Behance", name: "behance_url", widget: "string", required: false }

  - name: "fonts_management"
    label: "🖊️ إدارة معرض الخطوط"
    delete: true
    editor:
      preview: false
    files:
      - name: "font_list"
        label: "📋 قائمة الخطوط الحالية"
        file: "public/content.json"
        fields:
          - name: "fonts"
            label: "الخطوط المتاحة في المعرض"
            widget: "list"
            summary: "{{fields.title}} — {{fields.title_en}}"
            delete: true
            sort: true
            fields:
              # الهوية
              - { label: "الاسم العربي", name: "title", widget: "string", required: true }
              - { label: "الاسم اللاتيني", name: "title_en", widget: "string", required: true }
              - { label: "المعرف الرقمي", name: "id", widget: "number", value_type: "int", required: true, hint: "رقم فريد لكل خط" }

              # الأوصاف
              - { label: "الوصف بالعربية", name: "description_ar", widget: "text", required: true }
              - { label: "الوصف بالإنجليزية", name: "description_en", widget: "text", required: true }
              - { label: "الوصف بالكردية", name: "description_ku", widget: "text", required: false }

              # المعاينة
              - { label: "نص المعاينة", name: "preview_text", widget: "string", required: false, default: "الملك لله وحده" }

              # الصور
              - { label: "🖼️ صورة الغلاف", name: "image", widget: "image", required: false, hint: "ارفع صورة الغلاف الرئيسية" }
              - label: "📷 صور إضافية (بوسترات)"
                name: "images"
                widget: "list"
                required: false
                summary: "{{fields.src}}"
                field: { label: "رابط الصورة", name: "src", widget: "string" }

              # روابط التحميل
              - { label: "📥 رابط تحميل الخط", name: "downloadUrl", widget: "string", required: false }
              - { label: "رابط ملف المعاينة", name: "fontFile", widget: "string", required: false }
              - { label: "رابط حزمة ZIP", name: "zipUrl", widget: "string", required: false }

              # الأوزان
              - label: "⚖️ الأوزان المتاحة"
                name: "weights"
                widget: "select"
                multiple: true
                required: false
                options: ["Light", "Regular", "Medium", "Bold", "Black", "Salt", "Thin", "ExtraLight", "SemiBold", "ExtraBold"]

              # ملفات الأوزان
              - label: "📁 ملفات الأوزان"
                name: "weightFiles"
                widget: "object"
                required: false
                hint: "اربط رابط الملف لكل وزن متاح"
                fields:
                  - { label: "Light", name: "Light", widget: "string", required: false }
                  - { label: "Regular", name: "Regular", widget: "string", required: false }
                  - { label: "Medium", name: "Medium", widget: "string", required: false }
                  - { label: "Bold", name: "Bold", widget: "string", required: false }
                  - { label: "Black", name: "Black", widget: "string", required: false }
                  - { label: "Salt", name: "Salt", widget: "string", required: false }

              # التصنيف
              - { label: "🆕 خط جديد؟", name: "isNew", widget: "boolean", default: true, required: false }
              - { label: "🔓 خط مدفوع؟", name: "isPaid", widget: "boolean", default: false, required: false }
              - { label: "💵 السعر ($)", name: "price", widget: "number", value_type: "int", required: false, default: 0 }
              - { label: "📜 الترخيص", name: "license", widget: "string", required: false }

              # الأوزان المجانية والمدفوعة
              - label: "🆓 الأوزان المجانية"
                name: "freeWeights"
                widget: "select"
                multiple: true
                required: false
                options: ["Light", "Regular", "Medium", "Bold", "Black", "Salt", "Thin", "ExtraLight", "SemiBold", "ExtraBold"]
              - label: "💲 الأوزان المدفوعة"
                name: "paidWeights"
                widget: "select"
                multiple: true
                required: false
                options: ["Light", "Regular", "Medium", "Bold", "Black", "Salt", "Thin", "ExtraLight", "SemiBold", "ExtraBold"]

              # الطابع الزمني
              - { label: "📅 تاريخ الإنشاء", name: "createdAt", widget: "datetime", required: false }
              - { label: "📅 آخر تحديث", name: "updatedAt", widget: "datetime", required: false }

  - name: "social_links"
    label: "🔗 روابط التواصل الاجتماعي"
    delete: true
    editor:
      preview: false
    files:
      - name: "social_list"
        label: "📱 الحسابات المتصلة"
        file: "public/content.json"
        fields:
          - name: "socialLinks"
            label: "روابط التواصل"
            widget: "list"
            summary: "{{fields.platform}}"
            delete: true
            sort: true
            fields:
              - { label: "اسم المنصة", name: "platform", widget: "string", required: true }
              - { label: "الرابط", name: "url", widget: "string", required: true }
              - { label: "أيقونة (default/SVG)", name: "icon", widget: "string", required: false, default: "default" }
              - { label: "رمز SVG مخصص", name: "icon_svg", widget: "text", required: false }
              - { label: "🔢 ترتيب الظهور", name: "sort_order", widget: "number", value_type: "int", required: false, default: 0 }
