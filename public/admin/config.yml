backend:
  name: git-gateway
  repo: mr7li0f/OmarHassanTyp
  branch: main

media_folder: "public/assets"
public_folder: "/public/assets"

collections:
  - name: "site_settings"
    label: "إعدادات الموقع العامة"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "البيانات الأساسية والتواصل"
        file: "public/settings.json"
        fields:
          - { label: "عنوان الموقع الرئيسي", name: "site_title", widget: "string", required: true }
          - { label: "الاسم التجاري / التوقيع", name: "brand_name", widget: "string", required: true }
          - { label: "وصف الموقع المصغر (SEO)", name: "site_description", widget: "text", required: false }
          - { label: "نص الترحيب بالهيدر", name: "hero_text", widget: "string", required: false }
          - { label: "رابط تليجرام المباشر", name: "telegram_url", widget: "string", required: false }
          - { label: "رابط واتساب المباشر", name: "whatsapp_url", widget: "string", required: false }
          - { label: "رابط بهانس (Behance)", name: "behance_url", widget: "string", required: false }

  - name: "fonts_management"
    label: "🖊️ إدارة معرض الخطوط"
    delete: true
    editor:
      preview: false
    files:
      - name: "font_list"
        label: "📋 قائمة الخطوط الحالية"
        file: "public/content.json"
        fields:
          - name: "fonts"
            label: "الخطوط المتاحة في المعرض"
            widget: "list"
            summary: "{{fields.name}} ({{fields.id}})"
            identifier_field: "id"
            delete: true
            sort: true
            fields:
              # الأساسيات
              - { label: "اسم الخط العربي", name: "name", widget: "string", required: true }
              - { label: "الاسم اللاتيني (المعرف)", name: "id", widget: "string", required: true }
              - { label: "الوصف بالعربية", name: "description_ar", widget: "text", required: true }
              - { label: "الوصف بالإنجليزية", name: "description_en", widget: "text", required: true }
              - { label: "الوصف بالكردية", name: "description_ku", widget: "text", required: false }
              - { label: "نص المعاينة الافتراضي", name: "preview_text", widget: "string", required: false, default: "الملك لله وحده" }

              # الصور
              - label: "🖼️ صورة الغلاف"
                name: "image"
                widget: "image"
                required: false
                hint: "صورة الغلاف الرئيسية للخط — تظهر في بطاقة العرض"
              - label: "📷 معرض الصور (بوسترات إضافية)"
                name: "images"
                widget: "list"
                required: false
                summary: "📸 {{fields.url}}"
                field: { label: "رابط الصورة", name: "url", widget: "string" }

              # روابط التحميل والمعاينة
              - label: "📥 روابط التحميل"
                name: "downloadUrls"
                widget: "object"
                required: false
                summary: "روابط التحميل والمعاينة"
                hint: "روابط التحميل للملفات الرئيسية"
                fields:
                  - { label: "ربط تحميل الخط الأساسي (.otf / .ttf)", name: "downloadUrl", widget: "string", required: false }
                  - { label: "ملف الخط للمعاينة المباشرة", name: "fontFile", widget: "string", required: false }
                  - { label: "📦 حزمة ZIP مضغوطة كاملة", name: "zipUrl", widget: "string", required: false }

              # الأوزان وملفاتها
              - label: "⚖️ الأوزان المتاحة"
                name: "weights"
                widget: "list"
                required: false
                summary: "🔤 {{fields.weight}}"
                field: { label: "الوزن", name: "weight", widget: "string" }
              - label: "📁 ملفات الأوزان"
                name: "weightFiles"
                widget: "object"
                required: false
                summary: "ملفات الأوزان لكل وزن"
                hint: "ارفع ملف الخط الخاص بكل وزن (اختياري)"
                fields:
                  - { label: "Light", name: "Light", widget: "string", required: false }
                  - { label: "Regular", name: "Regular", widget: "string", required: false }
                  - { label: "Medium", name: "Medium", widget: "string", required: false }
                  - { label: "Bold", name: "Bold", widget: "string", required: false }
                  - { label: "Black", name: "Black", widget: "string", required: false }
                  - { label: "Salt", name: "Salt", widget: "string", required: false }

              # الترخيص والتصنيف
              - label: "💰 التصنيف التجاري"
                name: "pricing"
                widget: "object"
                required: false
                summary: "التصنيف التجاري والسعر"
                hint: "حدد إذا كان الخط مجاني أم مدفوع وأسعار الأوزان"
                fields:
                  - { label: "🔓 الخط مجاني؟", name: "isPaid", widget: "boolean", default: false, required: false }
                  - { label: "💵 السعر ($)", name: "price", widget: "number", value_type: "int", required: false, default: 0 }
                  - { label: "الترخيص", name: "license", widget: "string", required: false, hint: "مثال: Personal Use, Commercial, Open Source" }
                  - label: "الأوزان المجانية"
                    name: "freeWeights"
                    widget: "list"
                    required: false
                    summary: "🆓 {{fields.weight}}"
                    field: { label: "وزن مجاني", name: "weight", widget: "string" }
                  - label: "الأوزان المدفوعة"
                    name: "paidWeights"
                    widget: "list"
                    required: false
                    summary: "💲 {{fields.weight}}"
                    field: { label: "وزن مدفوع", name: "weight", widget: "string" }

              # حالة الخط
              - { label: "🆕 خط جديد؟", name: "isNew", widget: "boolean", default: true, required: false }

  - name: "social_links"
    label: "🔗 روابط التواصل الاجتماعي"
    delete: true
    editor:
      preview: false
    files:
      - name: "social_list"
        label: "📱 الحسابات المتصلة"
        file: "public/content.json"
        fields:
          - name: "socialLinks"
            label: "الروابط"
            widget: "list"
            summary: "{{fields.platform}}"
            delete: true
            sort: true
            fields:
              - { label: "اسم المنصة", name: "platform", widget: "string", required: true }
              - { label: "الرابط", name: "url", widget: "string", required: true }
              - { label: "رمز SVG مخصص (اختياري)", name: "icon_svg", widget: "text", required: false }
              - { label: "🔢 ترتيب الظهور", name: "sort_order", widget: "number", value_type: "int", required: false, default: 0 }
